# =============================================================================
# LapangIn — Nginx Configuration (Staging / Production)
# Target: Ubuntu 22.04 + PHP 8.3-FPM
# =============================================================================

# ── Security: Sembunyikan versi Nginx ────────────────────────────────────────
server_tokens off;

# ── Redirect HTTP → HTTPS ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name lapangin.biz.id www.lapangin.biz.id lapangin.australiaeast.cloudapp.azure.com;
    
    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Main Server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lapangin.biz.id www.lapangin.biz.id lapangin.australiaeast.cloudapp.azure.com;

    root /var/www/lapangin/public;
    index index.php;

    # ── SSL Certificate (Let's Encrypt via Certbot) ──────────────────────────
    ssl_certificate     /etc/letsencrypt/live/lapangin.biz.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lapangin.biz.id/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/lapangin.biz.id/chain.pem;

    # Protokol & cipher suite modern (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    # Content-Security-Policy — Alpine.js requires 'unsafe-eval' for directives (x-data, x-show, @click)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://app.sandbox.midtrans.com https://app.midtrans.com https://api.midtrans.com https://api.sandbox.midtrans.com https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.bunny.net; font-src 'self' https://fonts.gstatic.com https://fonts.bunny.net; img-src 'self' data: https:; connect-src 'self' https://api.midtrans.com https://api.sandbox.midtrans.com https://app.sandbox.midtrans.com https://app.midtrans.com; frame-src 'self' https://app.sandbox.midtrans.com https://app.midtrans.com;" always;

    # ── Upload limit (foto lapangan, dll.) ───────────────────────────────────
    client_max_body_size 10M;

    # ── Gzip Compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ── Laravel Front Controller ──────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ──────────────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_SSL on;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # ── Blokir akses ke file atau direktori tersembunyi (hidden files) ───────
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # ── Static asset caching ─────────────────────────────────────────────────
    location ~* \.(css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ── Midtrans Webhook — tidak ada rate limit ───────────────────────────────
    location /midtrans/webhook {
        try_files $uri /index.php?$query_string;
        # Batasi hanya dari IP Midtrans
        # allow 103.208.23.0/24;
        # allow 103.208.23.6;
        # deny all;
    }

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/lapangin_access.log;
    error_log  /var/log/nginx/lapangin_error.log warn;
}

