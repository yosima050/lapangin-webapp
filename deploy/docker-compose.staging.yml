# =============================================================================
# LapangIn — Docker Compose (Staging / Testing Environment)
# Digunakan untuk branch: development
# Jalankan: docker compose -p lapangin_staging -f deploy/docker-compose.staging.yml up -d
# =============================================================================

services:

  # ── Aplikasi Laravel Staging (PHP 8.3-FPM) ─────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: lapangin-app:staging
    container_name: lapangin_staging_app
    restart: unless-stopped
    environment:
      APP_ENV: staging
      APP_DEBUG: "true"
    env_file:
      - ../.env
    volumes:
      - ../:/var/www/lapangin
      - /var/www/lapangin/vendor
      - lapangin_staging_storage:/var/www/lapangin/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lapangin_staging_net

  # ── Nginx Web Server Staging ───────────────────────────────────────────────
  # Port 8080: Memungkinkan pengujian instan tanpa bentrok dengan Production (Port 80/443)
  nginx:
    image: nginx:1.27-alpine
    container_name: lapangin_staging_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../:/var/www/lapangin:ro
      - lapangin_staging_storage:/var/www/lapangin/storage:ro
      - ./nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - lapangin_staging_net

  # ── PostgreSQL 16 Staging Database (Terisolasi dari Production) ───────────
  db:
    image: postgres:16-alpine
    container_name: lapangin_staging_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-lapangin_db_staging}
      POSTGRES_USER: ${DB_USERNAME:-lapangin_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lapangin_staging_secret}
    volumes:
      - lapangin_staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-lapangin_user} -d ${DB_DATABASE:-lapangin_db_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lapangin_staging_net

  # ── Queue Worker Staging ───────────────────────────────────────────────────
  queue:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: lapangin-app:staging
    container_name: lapangin_staging_queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    env_file:
      - ../.env
    volumes:
      - ../:/var/www/lapangin
      - /var/www/lapangin/vendor
      - lapangin_staging_storage:/var/www/lapangin/storage
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - lapangin_staging_net

  # ── Scheduler Staging ──────────────────────────────────────────────────────
  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: lapangin-app:staging
    container_name: lapangin_staging_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - ../.env
    volumes:
      - ../:/var/www/lapangin
      - /var/www/lapangin/vendor
      - lapangin_staging_storage:/var/www/lapangin/storage
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - lapangin_staging_net

networks:
  lapangin_staging_net:
    driver: bridge

volumes:
  lapangin_staging_pgdata:
    driver: local
  lapangin_staging_storage:
    driver: local

