name: LapangIn CD (Continuous Deployment)

on:
  push:
    branches:
      - main
      - development

jobs:
  deploy:
    name: Deploy to Cloud VPS Server
    runs-on: ubuntu-latest

    steps:
      - name: Determine Target Environment
        id: env_select
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env_name=production" >> $GITHUB_OUTPUT
            echo "branch=main" >> $GITHUB_OUTPUT
            echo "target_dir=/var/www/lapangin" >> $GITHUB_OUTPUT
          else
            echo "env_name=staging" >> $GITHUB_OUTPUT
            echo "branch=development" >> $GITHUB_OUTPUT
            echo "target_dir=/var/www/lapangin-staging" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            TARGET_DIR="${{ steps.env_select.outputs.target_dir }}"
            ENV_NAME="${{ steps.env_select.outputs.env_name }}"
            BRANCH="${{ steps.env_select.outputs.branch }}"

            echo "=========================================================="
            echo "🚀 Memulai Deployment LapangIn Otomatis (CI/CD)"
            echo "   Environment : ${ENV_NAME}"
            echo "   Branch      : ${BRANCH}"
            echo "   Target Dir  : ${TARGET_DIR}"
            echo "=========================================================="

            if [ ! -d "${TARGET_DIR}" ]; then
              echo "⚠️ Direktori ${TARGET_DIR} belum ada. Melakukan clone awal secara idempoten..."
              sudo mkdir -p "${TARGET_DIR}"
              sudo chown -R $USER:$USER "${TARGET_DIR}"
              git clone -b "${BRANCH}" https://github.com/yosima050/lapangin-webapp.git "${TARGET_DIR}"
            fi

            cd "${TARGET_DIR}"
            bash deploy/deploy.sh "${ENV_NAME}" "${BRANCH}"

