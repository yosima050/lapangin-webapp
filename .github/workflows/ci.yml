name: LapangIn CI (Continuous Integration)

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  tests:
    name: Run Automated Tests & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, bcmath, gd, zip, pcntl
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Prepare Laravel Environment
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing

      - name: Run Test Suite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          APP_ENV: testing
          MIDTRANS_IS_PRODUCTION: false
        run: |
          php artisan test tests/Feature/HargaKhususDanAddonPerlengkapanTest.php tests/Feature/JadwalServiceTest.php tests/Feature/AdminLapanganCrudTest.php tests/Feature/AdminLaporanRekonsiliasiTest.php tests/Feature/KasirCheckInFlowTest.php tests/Feature/EndToEndBookingTest.php tests/Feature/GuestCheckoutAndAutoClaimTest.php tests/Feature/BookingAdjustmentServiceTest.php tests/Feature/PelangganProfileAndRiwayatPaymentTest.php tests/Feature/HardwareCheckinAndPublicPagesTest.php tests/Feature/KasirAndAdminDynamicFlowTest.php tests/Feature/KatalogSyncAndApiTest.php tests/Feature/LayoutsDynamicDataTest.php tests/Feature/MidtransCallbackTest.php tests/Feature/Auth/RegistrationTest.php tests/Unit/
